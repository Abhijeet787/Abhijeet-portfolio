    function renderPlaylist() {
      const playlistEl = document.getElementById('music-track-list');
      if (!playlistEl) return;
      
      playlistEl.innerHTML = trackList.map((track, index) => `
        <div class="music-playlist-item ${index === currentTrackIndex ? 'active' : ''}" onclick="playTrack(${index})">
          <div class="music-playlist-item-art">
            <img src="${track.img}" alt="${track.title}">
          </div>
          <div class="music-playlist-item-info">
            <div class="music-playlist-item-title">${track.title}</div>
            <div class="music-playlist-item-artist">${track.artist}</div>
          </div>
        </div>
      `).join('');
    }

    function playTrack(index) {
      currentTrackIndex = index;
      playProgress = 0;
      
      // Update UI elements
      const art = document.getElementById('music-art');
      const title = document.getElementById('music-title');
      const artist = document.getElementById('music-artist');
      const total = document.getElementById('music-time-total');
      const current = document.getElementById('music-time-current');
      const fill = document.getElementById('music-progress-fill');
      
      if (art) art.src = trackList[index].img;
      if (title) title.textContent = trackList[index].title;
      if (artist) artist.textContent = trackList[index].artist;
      if (total) total.textContent = trackList[index].duration;
      if (current) current.textContent = formatTime(0);
      if (fill) fill.style.width = '0%';
      
      renderPlaylist();
      
      // Set to play
      if (!isPlaying) {
        isPlaying = true;
        updatePlayButtonIcon();
      }
      
      startPlayInterval();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      updatePlayButtonIcon();
      
      if (isPlaying) {
        startPlayInterval();
      } else {
        clearInterval(playInterval);
      }
    }

    function updatePlayButtonIcon() {
      const playIcon = document.getElementById('play-icon');
      const pauseIcon = document.getElementById('pause-icon');
      if (playIcon && pauseIcon) {
        if (isPlaying) {
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        } else {
          playIcon.style.display = 'block';
          pauseIcon.style.display = 'none';
        }
      }
    }

    function startPlayInterval() {
      clearInterval(playInterval);
      playInterval = setInterval(() => {
        const currentTrack = trackList[currentTrackIndex];
        if (playProgress < currentTrack.seconds) {
          playProgress++;
          
          const current = document.getElementById('music-time-current');
          const fill = document.getElementById('music-progress-fill');
          
          if (current) current.textContent = formatTime(playProgress);
          if (fill) fill.style.width = `${(playProgress / currentTrack.seconds) * 100}%`;
        } else {
          nextTrack();
        }
      }, 1000);
    }

    function nextTrack() {
      let nextIndex = currentTrackIndex + 1;
      if (nextIndex >= trackList.length) nextIndex = 0;
      playTrack(nextIndex);
    }

    function prevTrack() {
      let prevIndex = currentTrackIndex - 1;
      if (prevIndex < 0) prevIndex = trackList.length - 1;
      playTrack(prevIndex);
    }

    function seekMusic(event) {
      const slider = event.currentTarget;
      const rect = slider.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const width = rect.width;
      const percentage = clickX / width;
      
      const currentTrack = trackList[currentTrackIndex];
      playProgress = Math.floor(percentage * currentTrack.seconds);
      
      const current = document.getElementById('music-time-current');
      const fill = document.getElementById('music-progress-fill');
      
      if (current) current.textContent = formatTime(playProgress);
      if (fill) fill.style.width = `${percentage * 100}%`;
    }

    function formatTime(secs) {
      const minutes = Math.floor(secs / 60);
      const seconds = secs % 60;
      return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    // ----------------------------------------------------
    // DESKTOP MARQUEE SELECTOR                             
    // ----------------------------------------------------
    function setupMarquee() {
      const desktop = document.getElementById('desktop');
      let marquee = null;
      let startX = 0;
      let startY = 0;

      desktop.addEventListener('mousedown', (e) => {
        // Only trigger on desktop container directly, not items/windows
        if (e.target !== desktop) return;
        e.preventDefault();

        startX = e.clientX;
        startY = e.clientY - 28; // account for menu bar height

        marquee = document.createElement('div');
        marquee.className = 'marquee-selection';
        marquee.style.left = startX + 'px';
        marquee.style.top = startY + 'px';
        desktop.appendChild(marquee);

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });

      function onMouseMove(e) {
        if (!marquee) return;
        const currentX = e.clientX;
        const currentY = e.clientY - 28;

        const left = Math.min(startX, currentX);
        const top = Math.min(startY, currentY);
        const width = Math.abs(startX - currentX);
        const height = Math.abs(startY - currentY);

        marquee.style.left = left + 'px';
        marquee.style.top = top + 'px';
        marquee.style.width = width + 'px';
        marquee.style.height = height + 'px';

        // Check intersections with badges
        const marqueeRect = marquee.getBoundingClientRect();
        document.querySelectorAll('.project-badge').forEach(badge => {
          const badgeRect = badge.getBoundingClientRect();
          const intersects = !(
            badgeRect.right < marqueeRect.left ||
            badgeRect.left > marqueeRect.right ||
            badgeRect.bottom < marqueeRect.top ||
            badgeRect.top > marqueeRect.bottom
          );

          if (intersects) {
            badge.classList.add('selected');
          } else {
            badge.classList.remove('selected');
          }
        });
      }

      function onMouseUp() {
        if (marquee) {
          marquee.remove();
          marquee = null;
        }
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      }
    }
